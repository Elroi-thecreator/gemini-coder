id: ARCH-001
type: architecture
title: Automated Issue-to-PR Application Scaffolder via NVIDIA NIM
domain: architecture
status: approved
version: "1.3.0"
rule: >-
  The GitHub Actions workflow (.github/workflows/gemini-builder.yml) triggers on issues labeled
  'build-app' or via workflow_dispatch, resolves the issue context, invokes .github/scripts/scaffold_app.py
  using NVIDIA_API_KEY against https://integrate.api.nvidia.com/v1 with stream=True and a 300s response timeout,
  and opens a Pull Request (with a direct branch-push fallback if GitHub Actions PR creation permissions are restricted).
do:
  - Use secrets.NVIDIA_API_KEY in GitHub Actions to authenticate with the NVIDIA NIM OpenAI-compatible endpoint.
  - Use stream=True with timeout=300.0 (configurable via NVIDIA_API_TIMEOUT) and max_tokens=16384 across verified active NVIDIA NIM models (z-ai/glm-5.3-flash, deepseek-ai/deepseek-v4.1-flash, google/gemma-4-31b-it, moonshotai/kimi-k3, moonshotai/kimi-k2.6, nvidia/nemotron-3.5-lightning-30b-a3b, nvidia/nemotron-3-super-120b-a12b) so extended reasoning and multi-file code generation have ample response time.
  - Provide a git branch push fallback if peter-evans/create-pull-request is blocked by repository PR settings.
dont:
  - Do not use short client timeouts (<300s) or stream=False on reasoning/coding models that perform extended thinking or large multi-file generation.
  - Do not include deprecated/404 NIM function IDs (e.g. mistralai/codestral-22b-instruct-v0.1) in the model list.
  - Do not allow generated files to overwrite reserved repository directories (.github, knowledge).
reason: >-
  NVIDIA NIM active models require sufficient response timeout (300s) and token budget (16384) to complete
  long reasoning chains and full multi-file application code generation without premature client timeouts.
related_items:
