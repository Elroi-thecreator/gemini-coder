name: Deploy to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'sample_a2ui_agui/**'
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sample_a2ui_agui/requirements.txt

      - name: Validate Server Import
        run: |
          python -c "import sample_a2ui_agui.backend.server as s; print('✅ Server verification passed!')"

      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "If your Render service is connected via Blueprint (render.yaml), Render auto-deploys automatically upon Git push."
            echo "To trigger deployments explicitly via GitHub Actions, add RENDER_DEPLOY_HOOK_URL in repository Secrets."
          else
            echo "🚀 Triggering deployment via Render Deploy Hook..."
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_HOOK")
            http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered!"
            else
              echo "❌ Failed to trigger Render deploy hook. Response: $response"
              exit 1
            fi
          fi
